<style>
/* ═══ RESTAURATION PRO — salle & commandes (barre de service, plan de salle, envoi en cuisine) ═══ */
#rp-svc-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;margin:0 0 2px;background:var(--bg-card,#fff);border-bottom:1.5px solid var(--border-color,#e0e0e0);font-size:.82rem;color:var(--text-main,#1e2d3d)}
#rp-svc-bar .rp-grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#rp-svc-bar .rp-sep{width:1px;height:26px;background:var(--border-color,#ddd);flex-shrink:0}
.rp-chip{border:1.5px solid var(--border-color,#d5d9de);background:var(--bg-card-2,#f3f4f6);color:var(--text-main,#1e2d3d);border-radius:999px;padding:7px 13px;font-weight:800;font-size:.78rem;cursor:pointer;white-space:nowrap;font-family:inherit;line-height:1.1;transition:transform .12s,box-shadow .12s}
.rp-chip:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.rp-chip.on{background:linear-gradient(135deg,#b5452b,#7a2718);border-color:#7a2718;color:#fff}
.rp-chip.fire{background:linear-gradient(135deg,#f97316,#c2410c);border-color:#c2410c;color:#fff}
.rp-chip.fire.idle{background:var(--bg-card-2,#f3f4f6);border-color:var(--border-color,#d5d9de);color:var(--text-muted,#777)}
.rp-chip.ready{border-color:#16a34a;box-shadow:0 0 0 2px rgba(22,163,74,.25)}
.rp-chip small{font-weight:700;opacity:.8;margin-left:4px}
#rp-svc-cur{font-weight:900;font-size:.86rem;padding:6px 12px;border-radius:10px;background:rgba(181,69,43,.1);color:#8a2c1c;white-space:nowrap}
body.dark-mode #rp-svc-cur{background:rgba(249,115,22,.16);color:#fdba74}
#rp-svc-open{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 100%;min-width:0}
#rp-svc-open:empty{display:none}

/* bloc service dans le panier */
#rp-cart-svc{margin:0 0 10px;padding:10px;border-radius:12px;background:rgba(181,69,43,.07);border:1.5px solid rgba(181,69,43,.3);color:var(--text-main,#1e2d3d);font-size:.8rem}
#rp-cart-svc .rp-t{font-weight:900;font-size:.9rem;display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px}
#rp-cart-svc .rp-t small{font-weight:700;color:var(--text-muted,#777);font-size:.7rem}
#rp-cart-svc .rp-g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#rp-cart-svc .rp-g .w2{grid-column:1/-1}
.rp-btn{border:none;border-radius:9px;padding:9px 8px;font-weight:800;font-size:.76rem;cursor:pointer;font-family:inherit;background:var(--bg-card-2,#eee);color:var(--text-main,#1e2d3d);border:1.5px solid var(--border-color,#d5d9de);line-height:1.15}
.rp-btn:disabled{opacity:.45;cursor:not-allowed}
.rp-btn.fire{background:linear-gradient(135deg,#f97316,#c2410c);color:#fff;border-color:#c2410c}
.rp-btn.pri{background:linear-gradient(135deg,#b5452b,#7a2718);color:#fff;border-color:#7a2718}
.rp-btn.ok{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;border-color:#15803d}
.rp-btn.dng{background:transparent;color:#dc2626;border-color:rgba(220,38,38,.45)}
.rp-btn.big{padding:13px 12px;font-size:.9rem}
#rp-cart-svc .rp-part{margin-top:8px;padding:8px 10px;border-radius:9px;background:#fef3c7;color:#92400e;font-weight:800;font-size:.76rem;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* lignes du panier : notes cuisine + état d'envoi */
.rp-line{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px;padding-top:7px;border-top:1px dashed var(--border-color,#ddd)}
.rp-line .rp-nt{background:#fff7ed;color:#9a3412;border:1px solid #fdba74;border-radius:7px;padding:2px 7px;font-size:.7rem;font-weight:800}
body.dark-mode .rp-line .rp-nt{background:#3b1d0b;color:#fdba74;border-color:#9a3412}
.rp-line .rp-st{font-size:.68rem;font-weight:800;border-radius:7px;padding:2px 7px}
.rp-line .rp-st.sent{background:rgba(22,163,74,.14);color:#15803d}
.rp-line .rp-st.todo{background:rgba(249,115,22,.16);color:#c2410c}
.rp-line .rp-st.al{background:rgba(220,38,38,.1);color:#b91c1c}
.rp-line button{margin-left:auto;border:1.5px solid var(--border-color,#d5d9de);background:var(--bg-card,#fff);color:var(--text-main,#333);border-radius:7px;padding:3px 8px;font-size:.7rem;font-weight:800;cursor:pointer;font-family:inherit}

/* fenêtres */
.rp-ov{position:fixed;inset:0;z-index:8000;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(10,12,20,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.rp-ov.show{display:flex}
.rp-box{width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--bg-card,#fff);color:var(--text-main,#1e2d3d);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.4);overflow:hidden;font-size:.86rem}
.rp-box.wide{width:min(980px,100%)}
.rp-hd{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,#b5452b,#7a2718);color:#fff}
.rp-hd b{flex:1;font-size:1rem;min-width:0}
.rp-hd button{border:none;background:rgba(255,255,255,.2);color:#fff;border-radius:9px;min-width:32px;height:32px;padding:0 10px;cursor:pointer;font-size:.86rem;font-weight:800;font-family:inherit}
.rp-bd{padding:14px 16px;overflow:auto;flex:1}
.rp-ft{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border-color,#e5e7eb)}
.rp-ft .rp-btn{flex:1}
.rp-lbl{display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted,#777);margin:10px 0 4px}
.rp-in{width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid var(--border-color,#d5d9de);border-radius:9px;font-size:.9rem;background:var(--input-bg,var(--bg-card,#fff));color:var(--text-main,#1e2d3d);font-family:inherit}
.rp-hint{font-size:.74rem;color:var(--text-muted,#777);line-height:1.45}
.rp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* plan de salle */
.rp-floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.rp-tbl{position:relative;border-radius:14px;padding:12px 10px;min-height:92px;cursor:pointer;border:2px solid #86efac;background:rgba(34,197,94,.08);display:flex;flex-direction:column;gap:3px;font-family:inherit;color:var(--text-main,#1e2d3d);text-align:left;transition:transform .12s,box-shadow .12s}
.rp-tbl:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.14)}
.rp-tbl b{font-size:1.25rem;line-height:1}
.rp-tbl small{font-size:.68rem;font-weight:700;color:var(--text-muted,#777)}
.rp-tbl .a{font-size:.9rem;font-weight:900}
.rp-tbl.busy{border-color:#f59e0b;background:rgba(245,158,11,.13)}
.rp-tbl.bill{border-color:#8b5cf6;background:rgba(139,92,246,.13)}
.rp-tbl.ready{border-color:#16a34a;background:rgba(22,163,74,.16);animation:rpPulse 1.4s ease-in-out infinite}
.rp-tbl.cur{box-shadow:0 0 0 3px #b5452b}
.rp-tbl .bdg{position:absolute;top:7px;right:8px;font-size:.66rem;font-weight:900;border-radius:999px;padding:2px 7px;background:#f97316;color:#fff}
.rp-tbl.ready .bdg{background:#16a34a}
.rp-tbl .ed{position:absolute;bottom:6px;right:6px;display:flex;gap:4px}
.rp-tbl .ed span{background:var(--bg-card,#fff);border:1px solid var(--border-color,#ccc);border-radius:6px;padding:1px 6px;font-size:.7rem}
@keyframes rpPulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}50%{box-shadow:0 0 0 7px rgba(22,163,74,0)}}
.rp-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.7rem;font-weight:700;color:var(--text-muted,#777);margin-top:12px}
.rp-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* notes, partage */
.rp-tags{display:flex;flex-wrap:wrap;gap:6px}
.rp-tag{border:1.5px solid var(--border-color,#d5d9de);background:var(--bg-card-2,#f3f4f6);color:var(--text-main,#1e2d3d);border-radius:999px;padding:8px 13px;font-weight:800;font-size:.8rem;cursor:pointer;font-family:inherit}
.rp-tag.on{background:#fff7ed;border-color:#f97316;color:#9a3412}
.rp-tag .x{margin-left:6px;opacity:.6}
.rp-step{display:inline-flex;align-items:center;gap:4px}
.rp-step button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--border-color,#d5d9de);background:var(--bg-card-2,#f3f4f6);color:var(--text-main,#1e2d3d);font-size:1.05rem;font-weight:900;cursor:pointer;font-family:inherit}
.rp-step b{min-width:34px;text-align:center;font-size:1rem}
.rp-li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-color,#eee)}
.rp-li:last-child{border-bottom:none}
.rp-li .n{flex:1;min-width:0;font-weight:700}
.rp-li .n small{display:block;font-weight:600;color:var(--text-muted,#777);font-size:.72rem}
.rp-li select{padding:8px 10px;border-radius:9px;border:1.5px solid var(--border-color,#d5d9de);background:var(--input-bg,var(--bg-card,#fff));color:var(--text-main,#1e2d3d);font-family:inherit;font-weight:700}
.rp-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg-card-2,#f3f4f6);font-weight:900;font-size:1rem}
.rp-sw{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-color,#eee);cursor:pointer}
.rp-sw input{width:20px;height:20px;margin-top:1px;flex-shrink:0}
.rp-sw b{display:block;font-size:.86rem}

       restopro_resto_cfg        réglages : salles et tables, postes de préparation, étapes du repas,

       restopro_resto_orders     commandes en cours (une par table / à emporter / livraison)
       restopro_resto_kds        bons envoyés en cuisine (écran cuisine) — non sauvegardé sur Drive
       restopro_resto_fiches     fiches techniques (recettes, ingrédients, coût de revient)
       restopro_resto_haccp      relevés HACCP (températures, nettoyage, réceptions, étiquettes)
       restopro_resto_allergens  allergènes par article de la carte
   • Sauvegarde : ces données voyagent dans la MÊME sauvegarde que le reste (Drive / fichier).
   • Stock : un plat peut être « suivi » (comme un article classique), « illimité » (fait à la
     demande) ou « selon fiche » (portions réalisables d'après le stock des ingrédients).
     À chaque plat vendu, le stock des ingrédients de sa fiche technique baisse tout seul.
   ════════════════════════════════════════════════════════════════════════ */
(function () {

        { id: 'crustaces', s: 'Crustacés', n: 'Crustacés', e: '🦐' },

        { id: 'poissons', s: 'Poissons', n: 'Poissons', e: '🐟' },
        { id: 'arachides', s: 'Arachides', n: 'Arachides', e: '🥜' },
        { id: 'soja', s: 'Soja', n: 'Soja', e: '🫘' },
        { id: 'lait', s: 'Lait', n: 'Lait (y compris lactose)', e: '🥛' },
        { id: 'fruitsacoque', s: 'Fruits à coque', n: 'Fruits à coque', e: '🌰' },
        { id: 'celeri', s: 'Céleri', n: 'Céleri', e: '🥬' },
        { id: 'moutarde', s: 'Moutarde', n: 'Moutarde', e: '🟡' },
        { id: 'sesame', s: 'Sésame', n: 'Graines de sésame', e: '⚪' },

    function defCfg() {
        return {
            v: 1,
            rooms: [
                { id: 'S', name: 'Salle', tables: defTables('S', 12, 4) },
                { id: 'T', name: 'Terrasse', tables: defTables('T', 6, 2).map(function (t) { t.name = 'T' + t.name; return t; }) }
            ],
            postes: [{ id: 'cuisine', name: 'Cuisine', icon: '🔥' }, { id: 'bar', name: 'Bar', icon: '🍹' }],
            courses: [{ id: 1, name: 'Entrées' }, { id: 2, name: 'Plats' }, { id: 3, name: 'Desserts' }],
            cats: {
                'Entrées': { poste: 'cuisine', course: 1, stock: 'illimite' },
                'Plats': { poste: 'cuisine', course: 2, stock: 'illimite' },
                'Desserts': { poste: 'cuisine', course: 3, stock: 'illimite' },
                'Boissons': { poste: 'bar', course: 0, stock: 'suivi' },

            },
            opts: { coursing: false, autoSendOnPay: true, printBon: false, bonPaper: '80', warnMin: 10, lateMin: 20, sound: true, askCovers: true },
            tags: ['Saignant', 'À point', 'Bien cuit', 'Sans oignon', 'Sans sauce', 'Sauce à part', 'Sans gluten', 'Végétarien', '⚠️ Allergie', 'À emporter'],
            haccp: {

                    { id: 'E1', name: 'Réfrigérateur cuisine', min: 0, max: 4 },
                    { id: 'E2', name: 'Chambre froide positive', min: 0, max: 4 },
                    { id: 'E3', name: 'Congélateur', min: -30, max: -18 },
                    { id: 'E4', name: 'Vitrine / bar réfrigéré', min: 0, max: 4 }
                ],
                clean: [
                    { id: 'N1', zone: 'Plans de travail', freq: 'jour', prod: 'Dégraissant désinfectant' },
                    { id: 'N2', zone: 'Sols cuisine', freq: 'jour', prod: 'Détergent sol' },
                    { id: 'N3', zone: 'Plonge et éviers', freq: 'jour', prod: 'Dégraissant désinfectant' },
                    { id: 'N4', zone: 'Poubelles', freq: 'jour', prod: 'Désinfectant' },
                    { id: 'N5', zone: 'Réfrigérateurs (intérieur)', freq: 'semaine', prod: 'Désinfectant alimentaire' },
                    { id: 'N6', zone: 'Hotte et filtres', freq: 'semaine', prod: 'Dégraissant' },
                    { id: 'N7', zone: 'Chambre froide', freq: 'mois', prod: 'Désinfectant alimentaire' },
                    { id: 'N8', zone: 'Murs et plinthes', freq: 'mois', prod: 'Détergent désinfectant' }

                tempPerDay: 2
            }
        };
    }
    var _cfgCache = null, _cfgRaw = null;
    function cfg() {
        var raw = null; try { raw = localStorage.getItem(K.cfg); } catch (e) {}
        if (_cfgCache && raw === _cfgRaw) return _cfgCache;
        var d = defCfg(), c = null;
        try { c = raw ? JSON.parse(raw) : null; } catch (e) { c = null; }
        if (!c || typeof c !== 'object') c = {};
        var out = d;
        ['rooms', 'postes', 'courses', 'tags'].forEach(function (k) { if (Array.isArray(c[k])) out[k] = c[k]; });
        if (c.cats && typeof c.cats === 'object') out.cats = c.cats;
        if (c.opts && typeof c.opts === 'object') Object.keys(c.opts).forEach(function (k) { out.opts[k] = c.opts[k]; });
        if (c.haccp && typeof c.haccp === 'object') Object.keys(c.haccp).forEach(function (k) { out.haccp[k] = c.haccp[k]; });

    var RX_BAR = /boisson|bar\b|vin|bi[eè]re|soft|soda|jus|caf[eé]|th[eé]|cocktail|ap[eé]ritif|alcool|digestif|eau/i;
    function catDef(cat, c) { c = c || cfg(); return (c.cats && c.cats[cat]) || null; }
    function meta(p, c) {

        var poste = p.rpPoste || cd.poste || (guessBar ? 'bar' : 'cuisine');
        var course = (p.rpCourse != null) ? +p.rpCourse : (cd.course != null ? +cd.course
            : (guessBar ? 0 : /entr[eé]e|starter|tapas|salade/i.test(p.category || '') ? 1 : /dessert|glace|sucr[eé]/i.test(p.category || '') ? 3 : 2));
        return {
            poste: poste, course: course,
            stock: p.rpStock || 'suivi',
            ingredient: p.rpIngredient === true,
            kitchen: poste !== 'aucun' && p.rpIngredient !== true
        };
    }
    function posteName(id, c) { c = c || cfg(); var p = (c.postes || []).filter(function (x) { return x.id === id; })[0]; return p ? (p.icon ? p.icon + ' ' : '') + p.name : id; }
    function courseName(id, c) { c = c || cfg(); if (!+id) return 'Direct'; var p = (c.courses || []).filter(function (x) { return +x.id === +id; })[0]; return p ? p.name : 'Étape ' + id; }

    /* ───────── Fiches techniques : conversions, coût de revient, portions réalisables ───────── */
    var UNITS = { g: 'g', kg: 'kg', ml: 'mL', cl: 'cL', l: 'L', piece: 'pièce' };
    function fiches() { var f = lsJ(K.fiches, []); return Array.isArray(f) ? f : []; }
    function saveFiches(list) { return lsSet(K.fiches, list); }
    /* quantité d'une ligne de fiche exprimée dans l'unité de stock de l'ingrédient (kg ou pièce) */
    function baseQty(it, ing) {

        var byWeight = !ing || ing.unitType === 'kg';
        var v;
        if (u === 'piece') v = q;
        else if (u === 'kg' || u === 'l') v = q;
        else if (u === 'cl') v = q / 100;
        else v = q / 1000;                       // g, ml
        if (!byWeight && u !== 'piece') v = q;   // ingrédient compté à la pièce : la quantité est un nombre de pièces

    }

    function ficheCost(f, byId) {

        (f.items || []).forEach(function (it) {
            var ing = it.pid != null ? byId[String(it.pid)] : null;
            var unitCost = ing ? num(ing.costPrice) : num(it.cost);
            if (!unitCost) missing.push(ing ? ing.name : (it.name || '?'));
            total += baseQty(it, ing) * unitCost;
        });

    }
    function fichePortions(f, byId) {
        var n = Math.max(1, num(f.portions) || 1), best = Infinity, tracked = 0;
        (f.items || []).forEach(function (it) {
            if (it.pid == null) return;
            var ing = byId[String(it.pid)]; if (!ing) return;
            var per = baseQty(it, ing) / n; if (per <= 0) return;

            best = Math.min(best, Math.floor(Math.max(0, num(ing.stock)) / per + 1e-9));

    }

    /* ───────── Stocks : modes « illimité » et « selon fiche », sortie de stock des ingrédients ───────── */
    function histPush(p, before, after, type, reason, meta) {
        if (!Array.isArray(p.stockHistory)) p.stockHistory = [];
        p.stockHistory.push({ date: new Date().toISOString(), type: type, before: r3(before), after: r3(after), delta: r3(after - before), reason: reason, user: userName() || 'system', meta: meta || {} });
        if (p.stockHistory.length > 500) p.stockHistory = p.stockHistory.slice(-500);
    }

    function syncStocks(products) {

            if (p.rpIngredient === true) { if (p.rpVirt) { delete p.rpVirt; changed = true; } return; }

            if (!p.rpStock && (cd.stock === 'illimite' || (!cd.stock && !RX_BAR.test(p.category || '')))) { p.rpStock = num(p.stock) > 0 ? 'suivi' : 'illimite'; changed = true; }
            var mode = p.rpStock || 'suivi';
            if (mode === 'illimite') {
                if (!p.rpVirt) { p.rpVirt = true; changed = true; }
                if (p.stock !== UNLIMITED) { p.stock = UNLIMITED; changed = true; }
            } else if (mode === 'fiche') {
                var f = ficheFor(p.id, list);
                if (!f) { if (p.rpVirt) { delete p.rpVirt; changed = true; } return; }
                if (!byId) byId = indexById(products);
                var n = fichePortions(f, byId);
                if (!p.rpVirt) { p.rpVirt = true; changed = true; }
                if (p.stock !== n) { p.stock = n; changed = true; }
            } else if (p.rpVirt) {
                delete p.rpVirt; if (p.stock === UNLIMITED) p.stock = 0; changed = true;
            }
        });
        return changed;
    }
    /* Après une vente : sort du stock les ingrédients des fiches techniques des plats vendus. */
    function applySale(sale, products) {
        if (!sale || !Array.isArray(sale.items) || !Array.isArray(products)) return;
        var list = fiches(), byId = indexById(products), out = {};
        sale.items.forEach(function (item) {
            var f = ficheFor(item.id, list);
            if (!f || f.destock === false) return;
            var n = Math.max(1, num(f.portions) || 1), q = num(item.quantity);
            (f.items || []).forEach(function (it) {
                if (it.pid == null) return;
                var ing = byId[String(it.pid)]; if (!ing) return;
                var dq = baseQty(it, ing) / n * q; if (dq <= 0) return;
                var before = num(ing.stock), after = r3(before - dq);
                ing.stock = after;
                histPush(ing, before, after, 'sale', 'Vente — fiche technique « ' + (f.name || item.name || '') + ' » ×' + q, { saleId: sale.id, dish: item.id });
                out[String(ing.id)] = r3((out[String(ing.id)] || 0) + dq);
            });
        });
        var ids = Object.keys(out);
        if (ids.length) sale.rpDestock = ids.map(function (id) { return { id: byId[id].id, q: out[id] }; });
        syncStocks(products);
    }

    /* ───────── Bons de cuisine (écran cuisine) ───────── */
    function kdsList() { var l = lsJ(K.kds, []); return Array.isArray(l) ? l : []; }
    function kdsSave(l) {
        // on garde les bons actifs + les bons servis des dernières 24 h (300 au plus)
        var lim = Date.now() - 24 * 3600 * 1000;
        l = l.filter(function (t) { return t && (t.status !== 'served' || Date.parse(t.doneAt || t.at) > lim); });
        if (l.length > 300) l = l.slice(0, 300);
        return lsSet(K.kds, l);
    }
    function nextBonNo() {
        var s = lsJ(K.seq, null), d = dkey();
        if (!s || s.d !== d) s = { d: d, n: 0 };
        s.n++; lsSet(K.seq, s); return s.n;
    }
    /* lignes = [{pid,name,qty,notes:[],cancel,mod}] ; ctx = {orderId,label,mode,covers,fire,note,type} */
    function kdsSend(ctx, lines) {
        var c = cfg(), prods = lsJ(K.products, []), byId = indexById(prods), out = [];
        (lines || []).forEach(function (l) {
            var p = byId[String(l.pid)] || { id: l.pid, category: '' };
            var m = meta(p, c);
            if (!m.kitchen) return;
            out.push({ pid: l.pid, name: String(l.name || p.name || '').replace(/ (🏷️|🌙)$/, ''), qty: num(l.qty), notes: (l.notes || []).slice(0, 12),
                course: m.course, poste: m.poste, al: allergensOf(l.pid), cancel: !!l.cancel, mod: !!l.mod, done: false });
        });
        if (!out.length) return null;
        var t = { id: uid('K'), no: nextBonNo(), orderId: ctx.orderId || null, label: ctx.label || 'Vente directe', mode: ctx.mode || 'comptoir',
            covers: ctx.covers || 0, server: userName(), at: new Date().toISOString(), status: 'new', type: ctx.type || 'order',
            fire: ctx.fire != null ? ctx.fire : null, note: ctx.note || '', lines: out };
        var l = kdsList(); l.unshift(t); kdsSave(l);
        return t;
    }
    function kdsUpdate(id, fn) {
        var l = kdsList(), hit = null;
        l.forEach(function (t) { if (t.id === id) { fn(t); hit = t; } });
        if (hit) kdsSave(l);
        return hit;
    }
    /* « Réclamer la suite » : toutes les lignes de la commande jusqu'à l'étape donnée passent en préparation */
    function kdsFire(orderId, course) {
        var l = kdsList(), n = 0;
        l.forEach(function (t) { if (t.orderId === orderId && t.status !== 'served') { t.fire = Math.max(+t.fire || 0, +course); t.firedAt = new Date().toISOString(); if (t.status === 'ready') t.status = 'prep'; n++; } });
        if (n) kdsSave(l);
        return n;
    }
    var MODE_LBL = { table: '🍽️ Sur place', emporter: '🥡 À emporter', livraison: '🛵 Livraison', comptoir: '🧾 Comptoir' };
    function bonHtml(t, posteId) {
        var c = cfg(), paper = (c.opts.bonPaper === '58') ? 58 : 80;
        var lines = t.lines.filter(function (l) { return !posteId || l.poste === posteId; });
        var byCourse = {}; lines.forEach(function (l) { (byCourse[l.course] = byCourse[l.course] || []).push(l); });
        var keys = Object.keys(byCourse).map(Number).sort(function (a, b) { return a - b; });
        var h = '<div class="hd">' + (posteId ? esc(posteName(posteId, c)) : 'CUISINE') + '</div>'
            + '<div class="big">' + esc(t.label) + '</div>'
            + '<div class="sub">' + esc(MODE_LBL[t.mode] || t.mode) + (t.covers ? ' · ' + t.covers + ' couvert' + (t.covers > 1 ? 's' : '') : '') + '</div>'
            + '<div class="sub">Bon n° ' + t.no + ' · ' + hm(t.at) + ' · ' + esc(t.server || '') + '</div>'
            + (t.type === 'cancel' ? '<div class="alert">⚠ ANNULATION</div>' : '') + (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '');
        keys.forEach(function (k) {
            if (keys.length > 1 || k) h += '<div class="crs">— ' + esc(courseName(k, c)).toUpperCase() + (c.opts.coursing && t.fire != null && k > t.fire ? ' (À SUIVRE)' : '') + ' —</div>';
            byCourse[k].forEach(function (l) {
                h += '<div class="ln' + (l.cancel ? ' cx' : '') + '"><b>' + (l.cancel ? 'ANNULER ' : '') + l.qty + ' ×</b> ' + esc(l.name) + (l.mod ? ' <i>(modifié)</i>' : '') + '</div>';
                (l.notes || []).forEach(function (n) { h += '<div class="nt">→ ' + esc(n) + '</div>'; });
                if (l.al && l.al.length && (l.notes || []).some(function (n) { return /allerg/i.test(n); })) h += '<div class="nt">⚠ contient : ' + esc(l.al.map(function (a) { return allergenLabel(a).s; }).join(', ')) + '</div>';
            });
        });
        return '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Bon cuisine n° ' + t.no + '</title><style>'
            + '@page{size:' + paper + 'mm auto;margin:0}body{font-family:Arial,Helvetica,sans-serif;width:' + (paper - 6) + 'mm;margin:0 auto;padding:3mm 0 8mm;color:#000}'
            + '.hd{text-align:center;font-weight:900;font-size:13px;letter-spacing:2px;border-bottom:2px solid #000;padding-bottom:3px}'
            + '.big{text-align:center;font-weight:900;font-size:26px;margin:6px 0 2px}.sub{text-align:center;font-size:12px}'
            + '.alert{text-align:center;font-weight:900;font-size:16px;border:2px solid #000;margin:6px 0;padding:3px}.note{font-size:13px;font-style:italic;margin:5px 0}'
            + '.crs{text-align:center;font-weight:900;font-size:12px;margin:9px 0 4px}.ln{font-size:17px;margin:5px 0 1px}.ln.cx{text-decoration:line-through}'
            + '.nt{font-size:14px;font-weight:700;padding-left:14px}@media screen{body{padding:12px;border:1px dashed #999;margin-top:12px}}'
            + '</style></head><body>' + h + '<script>window.onload=function(){setTimeout(function(){window.print();},250);};<\/script></body></html>';
    }
    function bonPrint(t, posteId) {
        var w = window.open('', 'rpbon' + t.no, 'width=420,height=640');
        if (!w) return false;
        w.document.open(); w.document.write(bonHtml(t, posteId)); w.document.close();
        return true;
    }

    /* ───────── Changements faits dans une autre fenêtre (caisse ↔ écran cuisine) ───────── */
    function onChange(keys, fn) {
        keys = [].concat(keys);
        window.addEventListener('storage', function (e) { if (e.key && keys.indexOf(e.key) !== -1) { try { fn(e.key); } catch (x) {} } });
    }
    function beep(kind) {
        try {
            var C = window.AudioContext || window.webkitAudioContext; if (!C) return;
            var ctx = beep._c || (beep._c = new C()), t0 = ctx.currentTime;
            (kind === 'ready' ? [880, 1175] : [660, 880, 660]).forEach(function (f, i) {
                var o = ctx.createOscillator(), g = ctx.createGain();
                o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0.0001, t0 + i * 0.16);
                g.gain.exponentialRampToValueAtTime(0.25, t0 + i * 0.16 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.16 + 0.15);
                o.connect(g); g.connect(ctx.destination); o.start(t0 + i * 0.16); o.stop(t0 + i * 0.16 + 0.16);
            });
        } catch (e) {}
    }

    window.RestoCore = {
        APP: APP, K: K, BACKUP_KEYS: BACKUP_KEYS, UNLIMITED: UNLIMITED, ALLERGENS: ALLERGENS, UNITS: UNITS, MODE_LBL: MODE_LBL,
        lsJ: lsJ, lsSet: lsSet, esc: esc, uid: uid, num: num, r3: r3, eur: eur, dkey: dkey, hm: hm,
        user: user, userName: userName, isAdmin: isAdmin,
        cfg: cfg, saveCfg: saveCfg, defCfg: defCfg, meta: meta, catDef: catDef, posteName: posteName, courseName: courseName,
        allergenMap: allergenMap, allergensOf: allergensOf, allergenLabel: allergenLabel,
        onChange: onChange, beep: beep
    };
    window.RestoStock = {
        fiches: fiches, saveFiches: saveFiches, ficheFor: ficheFor, baseQty: baseQty, indexById: indexById,
        cost: ficheCost, portions: fichePortions, sync: syncStocks, applySale: applySale, histPush: histPush
    };
    window.RestoKds = {
        list: kdsList, save: kdsSave, send: kdsSend, update: kdsUpdate, fire: kdsFire, bonHtml: bonHtml, print: bonPrint
    };
})();

</script>
<script id="rp-ui-1">
/* ════════════════════════════════════════════════════════════════════════
   RESTAURATION PRO — INTERFACE RESTAURATION (1/2)
   Panneau « Restauration » : Salle & commandes, Écran cuisine.
   Le même code tourne dans la caisse (Restauration Pro) et dans Cuisine Pro.
   ════════════════════════════════════════════════════════════════════════ */
(function () {
    'use strict';
    if (window.RestoUI || !window.RestoCore) return;
    var C = window.RestoCore, S = window.RestoStock, KD = window.RestoKds;
    var esc = C.esc, num = C.num, eur = C.eur, lsJ = C.lsJ, lsSet = C.lsSet, K = C.K;
    var HOST = false;
    try { HOST = (typeof updateCartUI === 'function' && typeof cart !== 'undefined' && typeof products !== 'undefined'); } catch (e) { HOST = false; }
    var KITCHEN = (C.APP === 'cuisine');

    function $(id) { return document.getElementById(id); }
    function prods() { if (HOST) { try { return products; } catch (e) {} } var l = lsJ(K.products, []); return Array.isArray(l) ? l : []; }
    function saveProds(list) {
        if (HOST) { try { saveAll(); if (typeof renderProducts === 'function') renderProducts(); return; } catch (e) { console.warn('[Resto]', e); } }
        lsSet(K.products, list);
    }
    function getCart() { try { return cart; } catch (e) { return []; } }
    function setCart(a) { try { cart = a; } catch (e) {} }
    function clone(x) { return JSON.parse(JSON.stringify(x == null ? null : x)); }

    function toast(msg, kind) {
        var t = $('rp-toast');
        if (!t) { t = document.createElement('div'); t.id = 'rp-toast'; document.body.appendChild(t); }
        t.textContent = msg; t.className = 'show' + (kind ? ' ' + kind : '');
        clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = ''; }, 3400);
    }
    function closeDlg() { var d = $('rp-dlg'); if (d) d.remove(); }
    /* btns : [{t:'Texte', c:'pri', f:function(boite){ return false pour laisser ouvert }}] */
    function dlg(title, body, btns, wide) {
        closeDlg();
        var ov = document.createElement('div'); ov.className = 'rp-ov show'; ov.id = 'rp-dlg'; ov.style.zIndex = 9400;
        ov.innerHTML = '<div class="rp-box' + (wide ? ' wide' : '') + '"><div class="rp-hd"><b>' + title + '</b><button type="button" data-x>✕</button></div><div class="rp-bd">' + body + '</div><div class="rp-ft"></div></div>';
        var ft = ov.querySelector('.rp-ft');
        (btns || []).forEach(function (b) {
            var e = document.createElement('button'); e.type = 'button'; e.className = 'rp-btn big ' + (b.c || ''); e.textContent = b.t;
            e.onclick = function () { if (b.f && b.f(ov) === false) return; closeDlg(); };
            ft.appendChild(e);
        });
        ov.querySelector('[data-x]').onclick = closeDlg;
        ov.addEventListener('mousedown', function (e) { if (e.target === ov) closeDlg(); });
        document.body.appendChild(ov);
        return ov;
    }

    /* ───────── Panneau plein écran à onglets ───────── */
    var TABS = [], curTab = KITCHEN ? 'cuisine' : 'salle', timer = null;
    function addTab(t) { TABS.push(t); }
    function build() {
        if ($('rp-ui')) return;
        var u = document.createElement('div'); u.id = 'rp-ui';
        u.innerHTML = '<div class="rp-ui-hd"><div class="rp-ui-brand">🍽️ <b>' + (KITCHEN ? 'Cuisine Pro' : 'Restauration') + '</b></div><div id="rp-ui-tabs"></div>'
            + (KITCHEN ? '<span id="rp-ui-user"></span>' : '<button type="button" class="rp-ui-x" onclick="RestoUI.close()">✕ Fermer</button>') + '</div><div id="rp-ui-body"></div>';
        document.body.appendChild(u);
    }
    function visibleTabs() { return TABS.filter(function (t) { return !t.hostOnly || HOST; }); }
    function render() {
        var u = $('rp-ui'); if (!u || !u.classList.contains('show')) return;
        var tabs = visibleTabs();
        if (!tabs.some(function (t) { return t.id === curTab; })) curTab = tabs[0].id;
        $('rp-ui-tabs').innerHTML = tabs.map(function (t) {
            return '<button type="button" class="rp-chip' + (t.id === curTab ? ' on' : '') + '" onclick="RestoUI.open(\'' + t.id + '\')">' + t.label + '</button>';
        }).join('');
        if (KITCHEN && $('rp-ui-user')) $('rp-ui-user').textContent = C.userName() ? '👤 ' + C.userName() : '';
        var t = tabs.filter(function (x) { return x.id === curTab; })[0], body = $('rp-ui-body');
        var keep = body.scrollTop; body.innerHTML = ''; t.render(body); body.scrollTop = keep;
    }
    function open(tab) {
        build(); if (tab) curTab = tab;
        if (HOST) { try { S.sync(products); } catch (e) {} }
        $('rp-ui').classList.add('show'); render();
        clearInterval(timer); timer = setInterval(function () { if (isOpen('cuisine') && !$('rp-dlg')) render(); }, 30000);
    }
    function close() { var u = $('rp-ui'); if (u) u.classList.remove('show'); clearInterval(timer); }
    function isOpen(tab) { var u = $('rp-ui'); return !!(u && u.classList.contains('show') && (!tab || curTab === tab)); }

    /* ───────── Commandes en cours (une par table / à emporter / livraison) ───────── */
    var CURK = 'restopro_resto_cur', _loading = false, _moving = null;
    var ICON = { table: '🍽️', emporter: '🥡', livraison: '🛵', comptoir: '🧾' };
    function curId() { try { return sessionStorage.getItem(CURK) || null; } catch (e) { return null; } }
    function setCurId(id) { try { if (id) sessionStorage.setItem(CURK, id); else sessionStorage.removeItem(CURK); } catch (e) {} }
    function orders() { var o = lsJ(K.orders, []); return Array.isArray(o) ? o : []; }
    function saveOrders(l) { lsSet(K.orders, l); }
    function curOrder() {
        var id = curId(); if (!id) return null;
        var l = orders(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
        setCurId(null); return null;
    }
    function putOrder(o) { var l = orders(), hit = false; for (var i = 0; i < l.length; i++) if (l[i].id === o.id) { l[i] = o; hit = true; } if (!hit) l.push(o); saveOrders(l); }
    function dropOrder(id) { saveOrders(orders().filter(function (o) { return o.id !== id; })); }
    function lineTotal(it) { try { if (typeof _cartLineTotal === 'function') return num(_cartLineTotal(it)); } catch (e) {} return num(it.price) * num(it.quantity); }
    function cartSum(c) { return (c || []).reduce(function (s, it) { return s + lineTotal(it); }, 0); }
    function mergeItems(a, b) {
        a = a || [];
        (b || []).forEach(function (it) {
            var ex = a.filter(function (x) { return String(x.id) === String(it.id); })[0];
            if (ex) { ex.quantity = C.r3(num(ex.quantity) + num(it.quantity)); if (it.rpNotes && it.rpNotes.length) ex.rpNotes = (ex.rpNotes || []).concat(it.rpNotes); }
            else a.push(it);
        });
        return a;
    }
    function loadCart(items) {
        _loading = true;
        try { setCart(clone(items || [])); updateCartUI(); } catch (e) { console.warn('[Resto]', e); } finally { _loading = false; }
        onCart();
    }
    /* appelé à chaque affichage du panier : la commande de la table suit le panier */
    function onCart() {
        if (!HOST || _loading) return;
        var o = curOrder();
        if (o) { var c = getCart() || []; o.items = clone(c); o.total = cartSum(c); o.upd = Date.now(); putOrder(o); }
        cartBar(); fab();
    }
    function activate(o) {
        var prev = curOrder(), c = getCart() || [];
        if (prev && prev.id === o.id) { close(); return; }
        if (!prev && c.length) o.items = mergeItems(o.items || [], clone(c));   // panier « comptoir » en cours : rattaché à la commande choisie
        putOrder(o); setCurId(o.id); loadCart(o.items);
        close(); toast(ICON[o.mode] + ' ' + o.label + ' — ajoutez les articles, puis « Envoyer en cuisine »', 'ok');
    }
    function newOrder(p) { return { id: C.uid('O'), mode: p.mode, tableId: p.tableId || null, label: p.label, covers: p.covers || 0, items: [], total: 0, at: Date.now(), by: C.userName() }; }
    function findTable(tid) { var out = null; C.cfg().rooms.forEach(function (r) { (r.tables || []).forEach(function (t) { if (t.id === tid) out = { t: t, r: r }; }); }); return out; }
    function tableLabel(x) { return 'Table ' + x.t.name + (C.cfg().rooms.length > 1 ? ' · ' + x.r.name : ''); }
    function askCovers(def, cb, title) {
        var n = Math.max(1, def || 2);
        var d = dlg('👥 ' + esc(title || 'Couverts'), '<div style="text-align:center"><div class="rp-hint" style="margin-bottom:12px">Nombre de couverts</div><div class="rp-step"><button type="button" data-m>−</button><b data-n style="font-size:1.6rem;min-width:60px">' + n + '</b><button type="button" data-p>+</button></div></div>',
            [{ t: 'Annuler' }, { t: 'Valider', c: 'pri', f: function () { cb(n); } }]);
        var lab = d.querySelector('[data-n]');
        d.querySelector('[data-m]').onclick = function () { n = Math.max(1, n - 1); lab.textContent = n; };
        d.querySelector('[data-p]').onclick = function () { n = Math.min(99, n + 1); lab.textContent = n; };
    }
    function pickTable(tid) {
        var x = findTable(tid); if (!x) return;
        var ex = orders().filter(function (o) { return o.tableId === tid; })[0];
        if (_moving) {
            if (ex) { toast('Cette table est déjà occupée', 'ko'); return; }
            var mo = orders().filter(function (o) { return o.id === _moving; })[0]; _moving = null;
            if (mo) { mo.tableId = tid; mo.mode = 'table'; mo.label = tableLabel(x); putOrder(mo); toast('🔀 Commande transférée : ' + mo.label, 'ok'); }
            cartBar(); fab(); render(); return;
        }
        if (ex) return activate(ex);
        var mk = function (cov) { activate(newOrder({ mode: 'table', tableId: tid, label: tableLabel(x), covers: cov })); };
        if (C.cfg().opts.askCovers) askCovers(x.t.seats || 2, mk, tableLabel(x)); else mk(0);
    }
    function newService(mode) {
        var name = mode === 'livraison' ? 'Livraison' : 'À emporter';
        var d = dlg(ICON[mode] + ' ' + name, '<label class="rp-lbl">Nom du client (facultatif)</label><input class="rp-in" data-n placeholder="ex. Martin">'
            + (mode === 'livraison' ? '<label class="rp-lbl">Adresse / téléphone (facultatif)</label><input class="rp-in" data-a placeholder="ex. 12 rue des Lilas · 06…">' : ''),
            [{ t: 'Annuler' }, { t: 'Créer la commande', c: 'pri', f: function (b) {
                var n = b.querySelector('[data-n]').value.trim(), a = b.querySelector('[data-a]');
                var o = newOrder({ mode: mode, label: name + ' ' + C.hm() + (n ? ' — ' + n : '') });
                if (a && a.value.trim()) o.info = a.value.trim();
                activate(o);
            } }]);
        setTimeout(function () { var i = d.querySelector('[data-n]'); if (i) i.focus(); }, 50);
    }
    function park() {
        var o = curOrder();
        if (o && !(getCart() || []).length) dropOrder(o.id);
        setCurId(null); loadCart([]);
        if (o) toast('⏸️ ' + o.label + ' mise en attente — retrouvez-la dans « Salle »');
    }
    function cancelOrder() {
        var o = curOrder(); if (!o) return;
        dlg('✕ Annuler la commande', '<p style="margin:0">Annuler toute la commande <b>' + esc(o.label) + '</b> ? La table sera libérée et le panier vidé.</p>',
            [{ t: 'Non, garder' }, { t: 'Oui, annuler', c: 'dng', f: function () {
                var sent = (o.items || []).filter(function (it) { return num(it.rpSent) > 0; }).map(function (it) { return { pid: it.id, name: it.name, qty: num(it.rpSent), cancel: true }; });
                if (sent.length) KD.send({ orderId: o.id, label: o.label, mode: o.mode, covers: o.covers, type: 'cancel' }, sent);
                dropOrder(o.id); setCurId(null); loadCart([]); toast('Commande annulée');
            } }]);
    }
    function setCovers() {
        var o = curOrder(); if (!o) return;
        askCovers(o.covers || 2, function (n) { o.covers = n; putOrder(o); cartBar(); }, o.label);
    }
    function move() { var o = curOrder(); if (!o) return; _moving = o.id; open('salle'); toast('🔀 Touchez la table libre où transférer la commande'); }

    /* ───────── Notes cuisine sur une ligne du panier ───────── */
    function note(id) {
        var it = (getCart() || []).filter(function (c) { return String(c.id) === String(id); })[0]; if (!it) return;
        var tags = C.cfg().tags || [], sel = (it.rpNotes || []).slice();
        var free = sel.filter(function (n) { return tags.indexOf(n) === -1; }).join(', ');
        var al = C.allergensOf(it.id).map(function (a) { return C.allergenLabel(a); });
        var d = dlg('📝 ' + esc(it.name), '<div class="rp-tags">' + tags.map(function (t, i) { return '<button type="button" class="rp-tag' + (sel.indexOf(t) !== -1 ? ' on' : '') + '" data-i="' + i + '">' + esc(t) + '</button>'; }).join('') + '</div>'
            + '<label class="rp-lbl">Précision libre</label><input class="rp-in" data-f value="' + esc(free) + '" placeholder="ex. sans coriandre, cuisson rosée…">'
            + (al.length ? '<p class="rp-hint" style="margin-top:12px">⚠️ Allergènes de ce plat : <b>' + al.map(function (a) { return a.e + ' ' + esc(a.s); }).join(' · ') + '</b></p>' : ''),
            [{ t: 'Effacer', f: function () { delete it.rpNotes; updateCartUI(); } }, { t: 'Valider', c: 'pri', f: function (b) {
                var out = []; b.querySelectorAll('.rp-tag.on').forEach(function (e) { out.push(tags[+e.getAttribute('data-i')]); });
                b.querySelector('[data-f]').value.split(',').forEach(function (s) { s = s.trim(); if (s) out.push(s); });
                if (out.length) it.rpNotes = out; else delete it.rpNotes;
                if (num(it.rpSent) > 0) it.rpMod = true;
                updateCartUI();
            } }]);
        d.querySelectorAll('.rp-tag').forEach(function (e) { e.onclick = function () { e.classList.toggle('on'); }; });
    }
    function lineExtra(item) {
        try {
            var p = S.indexById(prods())[String(item.id)] || item, m = C.meta(p);
            var notes = item.rpNotes || [], sent = num(item.rpSent), q = num(item.quantity);
            if (!m.kitchen && !notes.length) return '';
            var h = '<div class="rp-line">';
            notes.forEach(function (n) { h += '<span class="rp-nt">' + esc(n) + '</span>'; });
            if (sent > 0) h += '<span class="rp-st sent">✓ ' + (sent >= q ? 'en cuisine' : sent + '/' + q + ' en cuisine') + '</span>';
            else if (m.kitchen) h += '<span class="rp-st todo">à envoyer</span>';
            h += '<button type="button" onclick="RestoSvc.note(\'' + String(item.id).replace(/[^\w.-]/g, '') + '\')">📝 Note</button></div>';
            return h;
        } catch (e) { return ''; }
    }

    /* ───────── Envoi en cuisine ───────── */
    function pending(items) {
        var lines = [];
        (items || []).forEach(function (it) {
            var q = num(it.quantity), s = num(it.rpSent);
            if (q > s) lines.push({ pid: it.id, name: it.name, qty: C.r3(q - s), notes: it.rpNotes || [], mod: false });
            else if (q < s) lines.push({ pid: it.id, name: it.name, qty: C.r3(s - q), cancel: true });
            else if (it.rpMod) lines.push({ pid: it.id, name: it.name, qty: q, notes: it.rpNotes || [], mod: true });
        });
        return lines;
    }
    function ctxOf(o, sale) {
        return o ? { orderId: o.id, label: o.label, mode: o.mode, covers: o.covers, note: o.info || '' }
            : { label: 'Comptoir' + (sale && (sale.ticketNum || sale.id) ? ' · ticket ' + (sale.ticketNum || String(sale.id).slice(-4)) : ' ' + C.hm()), mode: 'comptoir' };
    }
    function send() {
        var c = getCart() || [], o = curOrder(), lines = pending(c);
        if (!lines.length) { toast('Rien de nouveau à envoyer en cuisine'); return; }
        var t = KD.send(ctxOf(o), lines);
        c.forEach(function (it) { it.rpSent = num(it.quantity); delete it.rpMod; });
        try { updateCartUI(); } catch (e) {}
        if (!t) { toast('Aucun article de ce panier ne passe en cuisine'); return; }
        toast('🔥 Bon n° ' + t.no + ' envoyé en cuisine — ' + t.label, 'ok');
        if (C.cfg().opts.printBon) KD.print(t);
    }
    /* ───────── Crochets posés dans la vente ───────── */
    function decorateSale(sale) {
        var o = curOrder();
        sale.rpSvc = o ? { mode: o.mode, label: o.label, covers: o.covers || 0, orderId: o.id } : { mode: 'comptoir', label: 'Comptoir' };
    }
    function afterSale(sale) {
        var o = curOrder(), opts = C.cfg().opts;
        if (opts.autoSendOnPay) {
            var lines = pending(sale.items || []).filter(function (l) { return !l.cancel; });
            if (lines.length) { var t = KD.send(ctxOf(o, sale), lines); if (t && opts.printBon) KD.print(t); }
        }
        if (o) { dropOrder(o.id); setCurId(null); }
        setTimeout(function () { cartBar(); fab(); if (isOpen('salle')) render(); }, 50);
    }
    function receiptLine(sale) {
        var s = sale && sale.rpSvc; if (!s || s.mode === 'comptoir') return '';
        return '<br>' + ICON[s.mode] + ' ' + esc(s.label) + (s.covers ? ' · ' + s.covers + ' couvert' + (s.covers > 1 ? 's' : '') : '');
    }

    /* ───────── Bloc « service » en tête du panier + bouton flottant ───────── */
    function cartBar() {
        if (!HOST) return;
        var items = $('cart-items'); if (!items || !items.parentNode) return;
        var b = $('rp-cart-svc');
        if (!b) { b = document.createElement('div'); b.id = 'rp-cart-svc'; items.parentNode.insertBefore(b, items); }
        var o = curOrder(), todo = pending(getCart() || []).length;
        var h = '<div class="rp-t"><span>' + (o ? ICON[o.mode] + ' ' + esc(o.label) + (o.covers ? ' · ' + o.covers + ' couv.' : '') : '🧾 Comptoir — vente directe') + '</span>' + (o ? '<small>depuis ' + C.hm(o.at) + '</small>' : '') + '</div><div class="rp-g">';
        h += '<button type="button" class="rp-btn pri" onclick="RestoUI.open(\'salle\')">🍽️ ' + (o ? 'Salle' : 'Choisir une table') + '</button>';
        h += '<button type="button" class="rp-btn fire"' + (todo ? '' : ' disabled') + ' onclick="RestoSvc.send()">🔥 Envoyer en cuisine' + (todo ? ' (' + todo + ')' : '') + '</button>';
        if (o) h += '<button type="button" class="rp-btn" onclick="RestoSvc.park()">⏸️ En attente</button><button type="button" class="rp-btn" onclick="RestoSvc.covers()">👥 Couverts</button>'
            + '<button type="button" class="rp-btn" onclick="RestoSvc.move()">🔀 Transférer</button><button type="button" class="rp-btn dng" onclick="RestoSvc.cancel()">✕ Annuler</button>';
        b.innerHTML = h + '</div>';
    }
    function fab() {
        if (!HOST) return;
        var f = $('rp-fab');
        if (!f) { f = document.createElement('button'); f.id = 'rp-fab'; f.type = 'button'; f.title = 'Salle, cuisine, fiches techniques, HACCP'; f.onclick = function () { open(); }; document.body.appendChild(f); }
        var o = curOrder(), n = orders().filter(function (x) { return (x.items || []).length; }).length;
        var rdy = KD.list().filter(function (t) { return t.status === 'ready'; }).length;
        f.className = rdy ? 'rdy' : '';
        f.innerHTML = '🍽️<span>' + (o ? esc(o.label) : 'Salle & cuisine') + '</span>' + (rdy ? '<i>✅ ' + rdy + '</i>' : (n ? '<i>' + n + '</i>' : ''));
    }

    /* ───────── Onglet Salle ───────── */
    function mins(ts) { return Math.max(0, Math.round((Date.now() - (typeof ts === 'number' ? ts : Date.parse(ts))) / 60000)); }
    function renderSalle(el) {
        var c = C.cfg(), ol = orders(), cur = curId(), kl = KD.list();
        var readyBy = {}; kl.forEach(function (t) { if (t.status === 'ready' && t.orderId) readyBy[t.orderId] = true; });
        var h = '';
        if (_moving) h += '<div class="rp-card" style="border-color:#f97316"><b>🔀 Transfert en cours</b> — touchez une table libre. <button type="button" class="rp-btn" onclick="RestoSvc.move(true)">Annuler le transfert</button></div>';
        h += '<div class="rp-h"><b>Service</b><button type="button" class="rp-chip' + (!cur ? ' on' : '') + '" onclick="RestoSvc.park();RestoUI.close()">🧾 Comptoir</button>'
            + '<button type="button" class="rp-chip" onclick="RestoSvc.neu(\'emporter\')">🥡 + À emporter</button><button type="button" class="rp-chip" onclick="RestoSvc.neu(\'livraison\')">🛵 + Livraison</button></div>';
        var others = ol.filter(function (o) { return !o.tableId && (o.items || []).length; });
        if (others.length) {
            h += '<div class="rp-card"><h3>🥡 À emporter & livraisons en cours</h3><div class="rp-floor">' + others.map(function (o) {
                return '<button type="button" class="rp-tbl busy' + (readyBy[o.id] ? ' ready' : '') + (o.id === cur ? ' cur' : '') + '" onclick="RestoSvc.act(\'' + o.id + '\')"><b style="font-size:.95rem">' + ICON[o.mode] + ' ' + esc(o.label.replace(/^(À emporter|Livraison) /, '')) + '</b><span class="a">' + eur(o.total) + '</span><small>' + (o.items || []).length + ' ligne(s) · ' + mins(o.at) + ' min</small>' + (readyBy[o.id] ? '<span class="bdg">prêt</span>' : '') + '</button>';
            }).join('') + '</div></div>';
        }
        c.rooms.forEach(function (r) {
            h += '<div class="rp-card"><h3>' + esc(r.name) + '</h3><div class="rp-floor">' + (r.tables || []).map(function (t) {
                var o = ol.filter(function (x) { return x.tableId === t.id; })[0], busy = o && ((o.items || []).length || o.id === cur);
                var todo = o ? pending(o.items).length : 0;
                return '<button type="button" class="rp-tbl' + (busy ? ' busy' : '') + (o && readyBy[o.id] ? ' ready' : '') + (o && o.id === cur ? ' cur' : '') + '" onclick="RestoSvc.pick(\'' + t.id + '\')"><b>' + esc(t.name) + '</b>'
                    + (busy ? '<span class="a">' + eur(o.total) + '</span><small>' + (o.covers ? o.covers + ' couv. · ' : '') + mins(o.at) + ' min</small>' + (readyBy[o.id] ? '<span class="bdg">prêt</span>' : (todo ? '<span class="bdg">' + todo + ' à envoyer</span>' : ''))
                        : '<small>' + (t.seats || 2) + ' places</small><small>libre</small>') + '</button>';
            }).join('') + '</div></div>';
        });
        h += '<div class="rp-legend"><span><i style="background:#86efac"></i>Libre</span><span><i style="background:#f59e0b"></i>Occupée</span><span><i style="background:#16a34a"></i>Plats prêts</span><span><i style="background:#b5452b"></i>Table en cours</span></div>';
        el.innerHTML = h;
    }
    addTab({ id: 'salle', label: '🍽️ Salle', hostOnly: true, render: renderSalle });

    /* ───────── Onglet Écran cuisine ───────── */
    var kPoste = '', kServed = false;
    var NEXT = { 'new': ['prep', '▶ Commencer', 'pri'], prep: ['ready', '✅ Prêt', 'ok'], ready: ['served', '🍽️ Servi', ''] };
    var STL = { 'new': 'Nouveau', prep: 'En préparation', ready: 'Prêt', served: 'Servi' };
    function renderCuisine(el) {
        var c = C.cfg(), all = KD.list(), o = c.opts;
        var list = all.filter(function (t) { return (kServed || t.status !== 'served') && (!kPoste || t.lines.some(function (l) { return l.poste === kPoste; })); });
        list.sort(function (a, b) { return Date.parse(a.at) - Date.parse(b.at); });
        var cnt = { 'new': 0, prep: 0, ready: 0 }; all.forEach(function (t) { if (cnt[t.status] != null) cnt[t.status]++; });
        var h = '<div class="rp-h"><b>🔥 ' + cnt['new'] + ' nouveau(x) · ' + cnt.prep + ' en préparation · ' + cnt.ready + ' prêt(s)</b>'
            + '<button type="button" class="rp-chip' + (!kPoste ? ' on' : '') + '" onclick="RestoUI.kf(\'\')">Tous les postes</button>'
            + c.postes.map(function (p) { return '<button type="button" class="rp-chip' + (kPoste === p.id ? ' on' : '') + '" onclick="RestoUI.kf(\'' + esc(p.id) + '\')">' + esc((p.icon || '') + ' ' + p.name) + '</button>'; }).join('')
            + '<button type="button" class="rp-chip' + (kServed ? ' on' : '') + '" onclick="RestoUI.ks()">🕘 Servis</button></div>';
        if (!list.length) h += '<div class="rp-empty">👨‍🍳 Aucun bon en attente.<br><small>Les commandes envoyées depuis la caisse apparaissent ici toutes seules.</small></div>';
        else {
            h += '<div class="rp-kds">' + list.map(function (t) {
                var m = mins(t.at), cls = t.status + (t.status === 'served' ? '' : (m >= o.lateMin ? ' late' : (m >= o.warnMin ? ' warn' : '')));
                var lines = t.lines.filter(function (l) { return !kPoste || l.poste === kPoste; });
                var byC = {}; lines.forEach(function (l) { (byC[l.course] = byC[l.course] || []).push(l); });
                var keys = Object.keys(byC).map(Number).sort(function (a, b) { return a - b; });
                var hh = '<div class="rp-tk ' + cls + '"><div class="rp-tk-h"><b>' + esc(t.label) + '</b><small>' + (t.status === 'served' ? C.hm(t.at) : m + ' min') + '</small></div>'
                    + '<div class="rp-tk-s">Bon n° ' + t.no + ' · ' + C.hm(t.at) + ' · ' + esc(C.MODE_LBL[t.mode] || t.mode) + (t.covers ? ' · ' + t.covers + ' couv.' : '') + (t.server ? ' · ' + esc(t.server) : '') + ' · <b>' + STL[t.status] + '</b></div>'
                    + (t.type === 'cancel' ? '<div class="rp-tk-l cx">⚠ ANNULATION</div>' : '') + (t.note ? '<div class="rp-tk-l"><span class="nt">' + esc(t.note) + '</span></div>' : '');
                keys.forEach(function (k) {
                    if (keys.length > 1) hh += '<div class="rp-tk-c">' + esc(C.courseName(k, c)) + '</div>';
                    byC[k].forEach(function (l) {
                        var i = t.lines.indexOf(l);
                        hh += '<div class="rp-tk-l' + (l.done ? ' done' : '') + (l.cancel ? ' cx' : '') + '" onclick="RestoUI.kl(\'' + t.id + '\',' + i + ')"><b>' + (l.cancel ? 'ANNULER ' : '') + l.qty + ' ×</b> ' + esc(l.name) + (l.mod ? ' <i>(modifié)</i>' : '')
                            + (l.notes || []).map(function (n) { return '<span class="nt">→ ' + esc(n) + '</span>'; }).join('')
                            + (l.al && l.al.length ? '<span class="nt" style="color:#b91c1c">⚠ ' + esc(l.al.map(function (a) { return C.allergenLabel(a).s; }).join(', ')) + '</span>' : '') + '</div>';
                    });
                });
                var nx = NEXT[t.status];
                hh += '<div class="rp-tk-f">' + (nx ? '<button type="button" class="rp-btn big ' + nx[2] + '" onclick="RestoUI.kn(\'' + t.id + '\',\'' + nx[0] + '\')">' + nx[1] + '</button>' : '<button type="button" class="rp-btn" onclick="RestoUI.kn(\'' + t.id + '\',\'ready\')">↩︎ Rappeler</button>')
                    + '<button type="button" class="rp-btn" style="flex:0 0 auto" title="Imprimer le bon" onclick="RestoUI.kp(\'' + t.id + '\')">🖨️</button></div></div>';
                return hh;
            }).join('') + '</div>';
        }
        el.innerHTML = h;
    }
    addTab({ id: 'cuisine', label: '🔥 Cuisine', render: renderCuisine });

    /* ───────── Synchronisation entre fenêtres (caisse ↔ cuisine) ───────── */
    var seen = {}; KD.list().forEach(function (t) { seen[t.id] = t.status; });
    C.onChange([K.kds, K.orders, K.products, K.cfg, K.fiches], function (key) {
        if (key === K.kds) {
            var nNew = 0, nReady = [];
            KD.list().forEach(function (t) { if (!seen[t.id]) nNew++; else if (seen[t.id] !== 'ready' && t.status === 'ready') nReady.push(t.label); seen[t.id] = t.status; });
            if (C.cfg().opts.sound) { if (nNew && (KITCHEN || isOpen('cuisine'))) C.beep('new'); else if (nReady.length && HOST) C.beep('ready'); }
            if (nReady.length && HOST) toast('✅ Prêt : ' + nReady.join(', '), 'ok');
        }
        if (key === K.products && HOST) {
            // réglages restauration modifiés depuis Cuisine Pro : repris dans la caisse ouverte
            try { var fresh = S.indexById(lsJ(K.products, [])); products.forEach(function (p) { var f = fresh[String(p.id)]; if (!f) return; ['rpStock', 'rpIngredient', 'rpPoste', 'rpCourse'].forEach(function (k) { if (f[k] !== undefined) p[k] = f[k]; else delete p[k]; }); }); S.sync(products); } catch (e) {}
        }
        fab(); if (isOpen() && !$('rp-dlg')) render();
    });

    window.RestoUI = {
        HOST: HOST, KITCHEN: KITCHEN, open: open, close: close, render: render, isOpen: isOpen, addTab: addTab, dlg: dlg, closeDlg: closeDlg, toast: toast,
        prods: prods, saveProds: saveProds, $: $,
        kf: function (p) { kPoste = p; render(); }, ks: function () { kServed = !kServed; render(); },
        kl: function (id, i) { KD.update(id, function (t) { if (t.lines[i]) t.lines[i].done = !t.lines[i].done; }); seen[id] = seen[id] || 'new'; render(); },
        kn: function (id, st) { KD.update(id, function (t) { t.status = st; if (st === 'prep' && !t.startAt) t.startAt = new Date().toISOString(); if (st === 'ready') t.readyAt = new Date().toISOString(); if (st === 'served') { t.doneAt = new Date().toISOString(); t.lines.forEach(function (l) { l.done = true; }); } }); seen[id] = st; fab(); render(); },
        kp: function (id) { var t = KD.list().filter(function (x) { return x.id === id; })[0]; if (t && !KD.print(t, kPoste || null)) toast('Autorisez les fenêtres pop-up pour imprimer', 'ko'); }
    };
    window.RestoSvc = {
        lineExtra: lineExtra, onCart: onCart, decorateSale: decorateSale, afterSale: afterSale, receiptLine: receiptLine,
        send: send, note: note, park: park, covers: setCovers, cancel: cancelOrder, pick: pickTable, neu: newService,
        act: function (id) { var o = orders().filter(function (x) { return x.id === id; })[0]; if (o) activate(o); },
        move: function (stop) { if (stop) { _moving = null; render(); } else move(); },
        orders: orders, current: curOrder
    };

    function boot() {
        if (HOST) {
            // les stocks « illimité » / « selon fiche » sont recalculés avant chaque affichage de la grille de vente
            try { var _rp = renderProducts; renderProducts = function () { try { S.sync(products); } catch (e) {} return _rp.apply(this, arguments); }; } catch (e) {}
            var o = curOrder();
            if (o && (o.items || []).length && !(getCart() || []).length) { _loading = true; try { setCart(clone(o.items)); updateCartUI(); } catch (e) {} _loading = false; }
            cartBar(); fab();
        } else if (KITCHEN) { open('cuisine'); }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
<script id="rp-ui-2">
/* ════════════════════════════════════════════════════════════════════════
   RESTAURATION PRO — INTERFACE RESTAURATION (2/2)
   Fiches techniques & allergènes, HACCP, Réglages.
   ════════════════════════════════════════════════════════════════════════ */
(function () {
    'use strict';
    var U = window.RestoUI, C = window.RestoCore, S = window.RestoStock;
    if (!U || !C || U._p2) return; U._p2 = true;
    var esc = C.esc, num = C.num, eur = C.eur, lsJ = C.lsJ, lsSet = C.lsSet, K = C.K;
    function dirty() { if (U.HOST) { try { if (typeof _gdTriggerAutoSave === 'function') _gdTriggerAutoSave(); } catch (e) {} } }
    function fr(d) { d = new Date(d); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + C.hm(d); }
    function opt(v, l, sel) { return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(l) + '</option>'; }
    function printDoc(title, html) {
        var w = window.open('', 'rpprint', 'width=900,height=700'); if (!w) { U.toast('Autorisez les fenêtres pop-up pour imprimer', 'ko'); return; }
        w.document.open();
        w.document.write('<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>body{font-family:Arial,Helvetica,sans-serif;margin:18px;color:#000}h1{font-size:18px;margin:0 0 4px}p{margin:0 0 12px;font-size:12px;color:#444}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #999;padding:5px 6px;text-align:left}th{background:#eee}.c{text-align:center}@media print{button{display:none}}</style></head><body><button onclick="window.print()" style="float:right;padding:8px 14px">🖨️ Imprimer</button>' + html + '</body></html>');
        w.document.close();
    }

    /* ═════════ FICHES TECHNIQUES ═════════ */
    var fView = 'plats', fQ = '';
    var MODES = { suivi: 'Stock suivi', illimite: 'Illimité (fait à la demande)', fiche: 'Selon la fiche (ingrédients)' };
    function unitOf(p) { return p && p.unitType === 'kg' ? 'kg' : 'pièce'; }
    function renderFiches(el) {
        var list = U.prods(), byId = S.indexById(list), fl = S.fiches(), c = C.cfg(), q = fQ.toLowerCase();
        var items = list.filter(function (p) { return p && p.name && (!q || String(p.name).toLowerCase().indexOf(q) !== -1 || String(p.category || '').toLowerCase().indexOf(q) !== -1); });
        var plats = items.filter(function (p) { return !C.meta(p, c).ingredient; }), ings = items.filter(function (p) { return C.meta(p, c).ingredient; });
        var h = '<div class="rp-h"><b>📖 Fiches techniques</b>'
            + '<button type="button" class="rp-chip' + (fView === 'plats' ? ' on' : '') + '" onclick="RestoUI.fv(\'plats\')">🍛 Plats <small>' + plats.length + '</small></button>'
            + '<button type="button" class="rp-chip' + (fView === 'ings' ? ' on' : '') + '" onclick="RestoUI.fv(\'ings\')">🥕 Ingrédients <small>' + ings.length + '</small></button>'
            + '<button type="button" class="rp-chip" onclick="RestoUI.fa()">🖨️ Tableau des allergènes</button></div>'
            + '<input class="rp-in" placeholder="🔍 Rechercher un article…" value="' + esc(fQ) + '" oninput="RestoUI.fq(this.value)" id="rp-fq" style="margin-bottom:12px">';
        if (!list.length) h += '<div class="rp-empty">Votre carte est vide.<br><small>Créez d\'abord vos plats et vos ingrédients dans le catalogue (Gestion → Produits). Rangez les matières premières dans la catégorie « Ingrédients ».</small></div>';
        else if (fView === 'plats') {

        h += '<div class="rp-card"><h3>🔥 Envoi en cuisine</h3>' + sw('askCovers', 'Demander le nombre de couverts', 'À l\'ouverture d\'une table.') + sw('autoSendOnPay', 'Envoyer en cuisine à l\'encaissement', 'Les articles pas encore envoyés partent en cuisine au moment du paiement (vente au comptoir).')
            + sw('printBon', 'Imprimer un bon de cuisine à chaque envoi', 'Ouvre la fenêtre d\'impression du bon (imprimante ticket).') + sw('sound', 'Signal sonore', 'Nouveau bon en cuisine, plat prêt en salle.')
            + '<div class="rp-row" style="margin-top:10px"><span class="rp-hint">Bon en orange après</span><input class="rp-in sm" style="width:70px" type="number" min="1" data-o="warnMin" value="' + o.warnMin + '"><span class="rp-hint">min, en rouge après</span><input class="rp-in sm" style="width:70px" type="number" min="1" data-o="lateMin" value="' + o.lateMin + '"><span class="rp-hint">min · papier</span><select class="rp-in sm" style="width:auto" data-o="bonPaper">' + opt('80', '80 mm', o.bonPaper) + opt('58', '58 mm', o.bonPaper) + '</select></div></div>';
        h += '<div class="rp-card"><h3>📝 Notes rapides pour la cuisine</h3><textarea class="rp-in" rows="4" data-tags placeholder="Une note par ligne">' + esc((c.tags || []).join('\n')) + '</textarea></div>';
        h += '<div class="rp-card"><h3>🗂️ Catégories de la carte</h3><p class="rp-hint" style="margin-top:0">Où part chaque catégorie quand on envoie en cuisine, et quelles catégories sont des matières premières.</p>' + Object.keys(cats).sort().map(function (k) {
            var cd = (c.cats || {})[k] || {}, m = C.meta({ category: k }, c);
            return '<div class="rp-li" data-cat="' + esc(k) + '"><div class="n">' + esc(k) + '</div><select data-k="poste">' + c.postes.map(function (p) { return opt(p.id, (p.icon || '') + ' ' + p.name, cd.poste || m.poste); }).join('') + opt('aucun', '— pas d\'envoi', cd.poste || m.poste) + '</select>'
                + '<select data-k="course">' + opt(0, 'Direct', cd.course != null ? cd.course : m.course) + c.courses.map(function (x) { return opt(x.id, x.name, cd.course != null ? cd.course : m.course); }).join('') + '</select>'
                + '<label style="display:flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700"><input type="checkbox" data-k="ing"' + (cd.ingredient ? ' checked' : '') + '> ingrédients</label></div>';
        }).join('') + '</div>';
        h += '<div class="rp-card"><h3>🌡️ HACCP — équipements froids</h3>' + (c.haccp.equip || []).map(function (e, i) {
            return '<div class="rp-row" data-eq="' + i + '" style="margin-bottom:8px"><input class="rp-in sm" style="flex:3;min-width:120px" data-k="name" value="' + esc(e.name) + '"><input class="rp-in sm" style="flex:1;min-width:60px" type="number" step="0.5" data-k="min" value="' + e.min + '" title="Minimum °C"><span class="rp-hint">à</span><input class="rp-in sm" style="flex:1;min-width:60px" type="number" step="0.5" data-k="max" value="' + e.max + '" title="Maximum °C"><span class="rp-hint">°C</span><button type="button" class="rp-btn dng" onclick="RestoUI.sd(\'equip\',' + i + ')">✕</button></div>';
        }).join('') + '<button type="button" class="rp-btn" onclick="RestoUI.sa(\'equip\')">➕ Ajouter un équipement</button></div>';
        h += '<div class="rp-card"><h3>🧽 HACCP — plan de nettoyage</h3>' + (c.haccp.clean || []).map(function (t, i) {
            return '<div class="rp-row" data-cl="' + i + '" style="margin-bottom:8px"><input class="rp-in sm" style="flex:2;min-width:110px" data-k="zone" value="' + esc(t.zone) + '" placeholder="Zone"><select class="rp-in sm" style="flex:1;min-width:100px" data-k="freq">' + Object.keys(FREQ).map(function (f) { return opt(f, FREQ[f], t.freq); }).join('') + '</select><input class="rp-in sm" style="flex:2;min-width:110px" data-k="prod" value="' + esc(t.prod || '') + '" placeholder="Produit utilisé"><button type="button" class="rp-btn dng" onclick="RestoUI.sd(\'clean\',' + i + ')">✕</button></div>';
        }).join('') + '<button type="button" class="rp-btn" onclick="RestoUI.sa(\'clean\')">➕ Ajouter une tâche</button></div>';
        if (window._rpMasterPwdIsSet && !window._rpMasterPwdIsSet()) h += '<div class="rp-card" style="border-color:#f59e0b"><h3>🔑 Mot de passe maître</h3><p class="rp-hint" style="margin-top:0">Aucun mot de passe maître n\'est défini sur cet appareil (le compte « Admin-Développeur » est donc inaccessible). Définissez-le ici ; il reste sur cet appareil et n\'est jamais envoyé dans les sauvegardes.</p><div class="rp-row"><input class="rp-in" style="flex:1" type="password" id="rp-mp" placeholder="8 caractères minimum" autocomplete="new-password"><button type="button" class="rp-btn pri big" onclick="RestoUI.sm()">Définir</button></div></div>';
        h += '<button type="button" class="rp-btn pri big" style="width:100%" onclick="RestoUI.ss()">💾 Enregistrer les réglages</button>';
        el.innerHTML = h;
    }
    function collectSettings() {
        var c = draft, body = U.$('rp-ui-body'); if (!c || !body) return;
        body.querySelectorAll('[data-room]').forEach(function (row) {
            var r = c.rooms[+row.getAttribute('data-room')]; if (!r) return;
            r.name = row.querySelector('[data-k="name"]').value.trim() || 'Salle';
            var n = Math.max(0, Math.min(200, Math.round(num(row.querySelector('[data-k="n"]').value)))), seats = Math.max(1, Math.round(num(row.querySelector('[data-k="seats"]').value)) || 2), t = (r.tables || []).slice(0, n);
            var pre = String(((r.tables || [])[0] || {}).name || '').replace(/\d+$/, '');
            for (var i = t.length; i < n; i++) t.push({ id: r.id + (i + 1), name: pre + (i + 1), seats: seats });
            t.forEach(function (x) { x.seats = seats; }); r.tables = t;
        });
        body.querySelectorAll('[data-o]').forEach(function (e) { var k = e.getAttribute('data-o'); c.opts[k] = e.type === 'checkbox' ? e.checked : (e.type === 'number' ? Math.max(1, num(e.value)) : e.value); });
        var tg = body.querySelector('[data-tags]'); if (tg) c.tags = tg.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        body.querySelectorAll('[data-cat]').forEach(function (row) {
            var k = row.getAttribute('data-cat'), cd = c.cats[k] || (c.cats[k] = {});
            cd.poste = row.querySelector('[data-k="poste"]').value; cd.course = +row.querySelector('[data-k="course"]').value;
            if (row.querySelector('[data-k="ing"]').checked) cd.ingredient = true; else delete cd.ingredient;
        });
        body.querySelectorAll('[data-eq]').forEach(function (row) { var e = c.haccp.equip[+row.getAttribute('data-eq')]; if (!e) return; e.name = row.querySelector('[data-k="name"]').value.trim() || 'Équipement'; e.min = num(row.querySelector('[data-k="min"]').value); e.max = num(row.querySelector('[data-k="max"]').value); });
        body.querySelectorAll('[data-cl]').forEach(function (row) { var t = c.haccp.clean[+row.getAttribute('data-cl')]; if (!t) return; t.zone = row.querySelector('[data-k="zone"]').value.trim() || 'Zone'; t.freq = row.querySelector('[data-k="freq"]').value; t.prod = row.querySelector('[data-k="prod"]').value.trim(); });
    }
    U.addTab({ id: 'reglages', label: '⚙️ Réglages', render: renderSettings });

    U.fv = function (v) { fView = v; U.render(); };
    U.fq = function (v) { fQ = v; U.render(); var i = U.$('rp-fq'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } };
    U.fm = function (pid, mode) {
        if (mode === 'fiche' && !S.ficheFor(pid)) { U.toast('Créez d\'abord la fiche technique de ce plat', 'ko'); U.render(); return; }
        setProd(pid, function (p) { p.rpStock = mode; }); U.toast('Stock : ' + MODES[mode], 'ok');
    };
    U.fi = function (pid, on) { setProd(pid, function (p) { p.rpIngredient = !!on; if (on) { delete p.rpStock; if (p.rpVirt) { delete p.rpVirt; if (p.stock === C.UNLIMITED) p.stock = 0; } } }); };
    U.fe = editFiche; U.fa = allergenSheet;
    U.hs = function (s) { hSub = s; U.render(); };
    U.ht = saveTemp;
    U.hc = function (id) { var t = (C.cfg().haccp.clean || []).filter(function (x) { return x.id === id; })[0]; if (!t) return; addRec({ type: 'clean', task: t.id, name: t.zone, prod: t.prod, ok: true }); U.toast('✔ ' + t.zone + ' — nettoyage enregistré', 'ok'); U.render(); };
    U.hr = function () {
        var g = function (id) { return U.$(id).value.trim(); };
        if (!g('rp-r-four') && !g('rp-r-prod')) { U.toast('Indiquez le fournisseur ou le produit', 'ko'); return; }
        addRec({ type: 'recep', four: g('rp-r-four'), prodName: g('rp-r-prod'), v: g('rp-r-t') === '' ? '' : num(g('rp-r-t')), dlc: g('rp-r-dlc'), ok: g('rp-r-ok') === '1', note: g('rp-r-note') });
        U.toast('📦 Réception enregistrée', 'ok'); U.render();
    };
    U.hm = function (m) { if (m) hMonth = m; U.render(); };
    U.hp = printReg;
    U.sa = function (what) {
        collectSettings();
        if (what === 'rooms') { var id = 'R' + Date.now().toString(36).slice(-4).toUpperCase(); draft.rooms.push({ id: id, name: 'Nouvelle salle', tables: [] }); }
        else if (what === 'equip') draft.haccp.equip.push({ id: C.uid('E'), name: 'Nouvel équipement', min: 0, max: 4 });
        else draft.haccp.clean.push({ id: C.uid('N'), zone: 'Nouvelle zone', freq: 'jour', prod: '' });
        U.render();
    };
    U.sd = function (what, i) { collectSettings(); (what === 'rooms' ? draft.rooms : draft.haccp[what]).splice(i, 1); U.render(); };
    U.ss = function () {
        collectSettings();
        var ids = {}; draft.rooms.forEach(function (r) { (r.tables || []).forEach(function (t) { ids[t.id] = 1; }); });
        var lost = (window.RestoSvc ? window.RestoSvc.orders() : lsJ(K.orders, [])).filter(function (o) { return o.tableId && !ids[o.tableId] && (o.items || []).length; });
        if (lost.length) { U.toast('Impossible : ' + lost[0].label + ' a une commande en cours', 'ko'); return; }
        C.saveCfg(draft); draft = null; dirty();
        if (U.HOST) { try { var l = U.prods(); if (S.sync(l)) U.saveProds(l); } catch (e) {} }
        U.toast('✅ Réglages enregistrés', 'ok'); U.render();
    };
    U.sm = function () {
        var v = (U.$('rp-mp').value || '').trim();
        if (v.length < 8) { U.toast('8 caractères minimum', 'ko'); return; }
        try { localStorage.setItem(K.master, v); } catch (e) {}
        U.toast('🔑 Mot de passe maître défini', 'ok'); U.render();
    };
})();

</script>
</body>
